name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build without bundled FFmpeg
        shell: pwsh -STA -NoLogo -NoProfile -NonInteractive -File {0}
        run: '& (Get-ChildItem -Path "./scripts*/*Build.ps1").FullName'
      - name: Check forms, languages, naming, capacity and random effects
        shell: pwsh -STA -NoLogo -NoProfile -NonInteractive -File {0}
        run: '& (Get-ChildItem -Path "./scripts*/*Check.ps1").FullName'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-tools-external-ffmpeg
          path: .build 本地构建/bin/
          if-no-files-found: error
          retention-days: 14
